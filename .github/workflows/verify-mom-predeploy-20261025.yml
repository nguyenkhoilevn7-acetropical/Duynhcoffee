name: Read-only predeploy order fingerprint (temporary)
on:
  push:
    branches:
      - 'predeploy/verify-mom-orders-20261025'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare live orders to recent Google Drive backup without printing PII
        env:
          EXPECTED_HASH: 1670231d20b63ed070587f4dd4d538d6dbafd37c2ec8d137fd171aaf7d07b27a
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const wanted = process.env.EXPECTED_HASH;
          const url = 'https://mom-bd4h.onrender.com/api/orders';
          async function check() {
            let lastErr;
            for (let i=0; i<4; i++) {
              try {
                const res = await fetch(url, {signal: AbortSignal.timeout(25000)});
                if (!res.ok) throw new Error('Read-only endpoint HTTP '+res.status);
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error('Unexpected order data shape');
                const list = data.map(o => ({
                  id: o.id,
                  status: o.status,
                  total: o.total,
                  paymentStatus: o.paymentStatus,
                  itemCount: Array.isArray(o.items) ? o.items.length : 0
                })).sort((a,b)=>a.id.localeCompare(b.id));
                const fingerprint = crypto.createHash('sha256').update(JSON.stringify(list)).digest('hex');
                console.log('Live count:', data.length, '| Backup count: 1');
                console.log('Exact order metadata match:', fingerprint === wanted ? 'YES' : 'NO');
                if (fingerprint !== wanted) throw new Error('Live data has changed since backup; STOP deploy');
                return;
              } catch(e) { lastErr=e; if (String(e).includes('STOP deploy')) throw e; }
            }
            throw lastErr;
          }
          check().catch(e => { console.error(e.message); process.exitCode=1; });
          NODE

      - name: Smoke-test deployed iOS admin assets and preserve live order state
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const base = 'https://mom-bd4h.onrender.com';
          async function get(path) {
            let error;
            for (let i = 0; i < 5; i++) {
              try {
                const response = await fetch(base+path, {signal: AbortSignal.timeout(25000), headers: {'cache-control': 'no-cache'}});
                if (!response.ok) throw new Error(path+' HTTP '+response.status);
                return response.text();
              } catch (e) {
                error=e;
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }
            throw error;
          }
          async function main() {
            const [html, css, js, recipeJs, rawOrders, saleJs, adminJs, saleCss, bannerJs, bannerCss, ratingJs, ratingCss, ratingApi] = await Promise.all([
              get('/'),get('/admin-ios.css?v=20261025-2'),get('/admin-ios.js?v=20261025-2'),get('/admin-recipes.js?v=20261025-2'),get('/api/orders'),get('/sale-promotions.js?v=20261026-1'),get('/sale-admin.js?v=20261028-1'),get('/sale-promotions.css?v=20261026-1'),get('/sale-banner.js?v=20261028-1'),get('/sale-banner.css?v=20261028-1'),get('/product-ratings-client.js?v=20261030-1'),get('/product-ratings.css?v=20261030-1'),get('/api/ratings')
            ]);
            const assetTests = {
              'HTML links new iOS CSS': html.includes('admin-ios.css?v=20261025-2'),
              'HTML links new iOS JS': html.includes('admin-ios.js?v=20261025-2'),
              'CSS supplies drawer styles': css.includes('#ios-admin-drawer'),
              'JS initializes menu toggle': js.includes('ios-admin-menu-toggle'),
              'Drawer is right-aligned': css.includes('inset: 0 0 0 auto'),
              'Order timing layout is active': css.includes('.ios-order-timing'),
              'Product quantity buttons have 10px gap': html.includes('#product-custom-modal .ios-qty-stepper') && html.includes('gap: 10px;'),
              'English handles missing recipes': recipeJs.includes('if(!state.recipe && !state.custom.trim())'),
              'SALE UI loaded': html.includes('id="mom-sale-products"') && html.includes('sale-admin.js?v=20261028-1'),
              'Flash SALE mounted inside hero': html.includes('id="mom-sale-hero" hidden'),
              'Flash SALE JS asset loaded': html.includes('sale-banner.js?v=20261028-1') && bannerJs.includes('function evaluateCampaigns('),
              'Flash SALE CSS asset loaded': html.includes('sale-banner.css?v=20261028-1') && bannerCss.includes('#mom-sale-hero[hidden]'),
              'Flash SALE off state hides instantly': bannerJs.includes('rootNode.hidden=true') && bannerJs.includes('rootNode.replaceChildren()'),
              'Flash SALE reason editor': html.includes('id="mom-sale-reason"') && adminJs.includes("el('mom-sale-reason').value=p.reason"),
              'Five-heart customer rating widget': html.includes('class="mom-heart-ratings"') && html.includes('product-ratings-client.js?v=20261030-1') && ratingJs.includes('MomDrinkRatings'),
              'Five-heart responsive styling': ratingCss.includes('.mom-heart-rating-btn'),
              'Live ratings endpoint returns real aggregates': (()=>{try{const x=JSON.parse(ratingApi);return x&&typeof x.ratings==='object'&&!Array.isArray(x.ratings)}catch{return false}})(),
              'SALE price shared': saleJs.includes('function calculate(items,discounts'),
              'SALE admin controls': adminJs.includes('async function create()'),
              'SALE CSS loaded': saleCss.includes('.mom-sale-admin')
            };
            Object.entries(assetTests).forEach(([name, ok]) => console.log(name+': '+(ok?'PASS':'FAIL')));
            if (Object.values(assetTests).some(ok => !ok)) throw new Error('Production UI smoke test failed');
            const orders = JSON.parse(rawOrders);
            if (!Array.isArray(orders)) throw new Error('Orders endpoint is not an array');
            const selected=orders.map(o=>({id:o.id,status:o.status,total:o.total,paymentStatus:o.paymentStatus,itemCount:Array.isArray(o.items)?o.items.length:0})).sort((a,b)=>a.id.localeCompare(b.id));
            const hash = crypto.createHash('sha256').update(JSON.stringify(selected)).digest('hex');
            const expected='1670231d20b63ed070587f4dd4d538d6dbafd37c2ec8d137fd171aaf7d07b27a';
            console.log('Orders preserved after deployment: '+(hash===expected?'PASS':'FAIL')+' | count='+orders.length);
            if(hash!==expected) throw new Error('Order data changed unexpectedly after deployment');
          }
          main().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE

# Predeploy read-only verification of live order fingerprint for CSS-only PR #8, 2026-10-26.

# Predeploy read-only check before automatic SALE campaign deployment (2026-10-26).

# Read-only live order metadata check before Flash Sale banner deployment (2026-10-28).

# Read-only live order fingerprint and existing storefront assets before verified heart ratings (2026-10-30).

# Rerun after Render confirmed new commit LIVE (2026-10-30).
