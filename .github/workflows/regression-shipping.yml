name: Regression tests - shipping UI and receipt
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Backend syntax
        run: node --check server.js && node --check receipt-jobs.js && node --check receipt-verification.js && node --check delivery.js
      - name: Full Node regression suite
        run: node --test test/*.test.js

  production-readonly-smoke:
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify Render serves new order card after deploy
        shell: bash
        run: |
          set -euo pipefail
          url='https://mom-bd4h.onrender.com/'
          for attempt in $(seq 1 20); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "$url" -o /tmp/moms-page.html; then
              if grep -Fq 'width:58px;height:58px;object-fit:cover' /tmp/moms-page.html; then
                echo 'SUCCESS: production homepage serves the new shipping card JavaScript.'
                exit 0
              fi
            fi
            echo "Attempt $attempt: new UI not visible yet; retrying..."
            sleep 12
          done
          echo 'FAIL: cannot verify that production serves the new UI. Check Render deploy and custom domains.' >&2
          exit 1
